name: Build NodeJS application and Test with SAST,SCA and DAST

on:
  push:
    branches: [main]

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  APP_NAME: hello-world-app
  IMAGE_NAME: hello-world-app
  IMAGE_TAG: ${{ github.sha }}
  k8s_cluster_name: hello-world-cluster


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Run unit Test and SAST Scan on Source code
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
       
      - name: Setup NodeJs App
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      
      - name: Install dependencies
        run: npm install

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
           SONAR_HOST_URL: https://sonarcloud.io
        with:
           args: >
             -Dsonar.projectKey=rohitb9980_DevSecOps
             -Dsonar.organization=rohitb9980
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high


      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: node-app-source
          path: |
            app.js
            package.json
            package-lock.json
            Dockerfile
            k8s/
        
  Unit-Test:
    name: Run Unit Test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps: 
      - name: Chekout code
        uses: actions/checkout@v6

      - name: Setup NodeJs App
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install
      
      - name: Run Unit Test
        run: npm test

  Upload-Artifacts:
    name: Upload Artifacts
    runs-on: ubuntu-latest
    needs: Unit-Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: node-app-source
          path: .
        
      - name: Archive Artifacts
        run: tar -czvf hello-node-app.tar.gz app.js package.json package-lock.json Dockerfile k8s
    
      - name: Upload Archived Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: hello-node-app-archive
          path: hello-node-app.tar.gz


  Docker-Build:
    name: Build Docker Image 
    runs-on: ubuntu-latest
    needs: Upload-Artifacts
    steps: 
      - name : Checkout Source code
        uses: actions/checkout@v6
      
      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-disable: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=image.tar

      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          args: --file=Dockerfile
        continue-on-error: true

      - name: Upload docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  Deploy-K8s:
    name: Deploy to Kubernetes Cluster
    runs-on: ubuntu-latest
    needs: Docker-Build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Download Docker image artifact
        uses: actions/download-artifact@v6
        with:
          name: docker-image
          path: .

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.12.0 
        with:
          cluster_name: ${K8S_CLUSTER_NAME}

      - name: Verify Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Load Docker image into Kind Cluster
        run: |
          docker load -i image.tar
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --name ${K8S_CLUSTER_NAME}

      - name: Deploy to Kind Cluster
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl set image deployment/${{ env.APP_NAME }} ${APP_NAME}=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -n default
          kubectl rollout status deployment/${{ env.APP_NAME }} -n default

      - name: Verify Deployment
        run: |
          kubectl get pods -n default
          kubectl get svc -n default

      - name: Expose application port for DAST
        run: |
          # Forwarding Kubernetes service port to runner's localhost background process
          kubectl port-forward svc/${{ env.APP_NAME }} 9092:8080 &
          sleep 5 

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:9092'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_action: true